<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Interactivo en Home</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav id="nav">
        <button class="menu-btn" >Home</button>
        <button class="menu-btn" >About</button>
        <button class="menu-btn" >Services</button>
        <button class="menu-btn" >Contact</button>
    </nav>
    <div class="content">
        <h1>Bienvenido a la Página Home</h1>
        <p>Esta es la sección home. Los botones del menú están integrados aquí:</p>
        
        <!-- Menú integrado en la página home -->
        <div id="menu">
            <button class="menu-btn" id="home">Home</button>
            <button class="menu-btn" id="about">About</button>
            <button class="menu-btn" id="services">Services</button>
            <button class="menu-btn" id="contact">Contact</button>
        </div>
        
        <p>Haz clic en los botones para interactuar. En móviles, se apilan verticalmente.</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
